# 서버(/opt/chakchak)에서 deploy.sh가 실행한다. 환경변수는 deploy.sh가 SSM·Secrets Manager에서 읽어 넘긴다.
name: chakchak

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: chakchak-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      MANAGEMENT_PORT: "9090"
    # actuator는 서버 안(127.0.0.1)에서만 본다. 헬스 확인과 나중의 Prometheus용
    ports:
      - "127.0.0.1:9090:9090"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
