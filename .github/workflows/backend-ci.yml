name: backend-ci

# 백엔드 코드나 이 파일이 바뀔 때만 돈다. 프론트·문서·인프라만 바뀐 PR에서는 돌지 않는다.
# backend/ 안의 Markdown(패키지 README 등)만 바뀌어도 돌지 않는다.
# main push는 deploy.yml이 같은 빌드를 하므로 여기서 다시 돌리지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이 job(backend)을 필수 상태 체크로 지정하면 paths 필터로 건너뛴 PR은 Pending으로 남아 머지가 막힌다.
  # 필수로 바꿀 때는 paths 필터를 빼거나, 변경 감지 후 스텝만 건너뛰는 방식으로 바꾼다.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle Wrapper jar 검증은 이 액션이 기본으로 한다. 캐시는 MIT 라이선스인 basic을 쓴다.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 컴파일, 포맷 검사(spotlessCheck, Google Java Format), 테스트(Testcontainers MySQL 포함), jar 생성까지 한 번에 한다.
      # Docker 이미지 빌드를 추가할 때는 이 job 안에서 이 스텝 뒤에 두고, 여기서 만든 jar를 그대로 쓴다.
      - name: 빌드, 포맷 검사, 테스트
        run: ./gradlew build

      # uses 스텝의 path는 working-directory가 적용되지 않으므로 저장소 최상위 기준으로 적는다.
      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
