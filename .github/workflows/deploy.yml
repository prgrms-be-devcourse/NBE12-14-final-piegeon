name: deploy

# main에 머지되면 자동 배포한다. 운영에 올라가는 브랜치는 main 하나다.
# Actions 탭의 "Run workflow"로 다시 배포할 수 있지만 main에서만 된다.
# 다른 브랜치를 배포하면 그 브랜치의 Flyway 마이그레이션이 운영 DB에 섞여 들어가 이후 배포가 막히고,
# 배포 역할(서버 root 셸 명령 가능)을 아무 브랜치에서나 쓸 수 있게 되기 때문이다.
# 실제로 막는 것은 GitHub Settings → Environments → production의 Deployment branches(main만 허용)다.
# 자동 배포는 서버에 올라가는 파일이 바뀔 때만 한다. 프론트·문서만 바뀐 머지는 배포하지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # AWS OIDC 로그인 (키를 저장하지 않는다)

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 다음 배포가 기다린다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main이 아니면 건너뛴다. 실수로 다른 브랜치에서 Run workflow를 눌렀을 때 바로 알 수 있게 하는 표시다.
    # 이 줄은 브랜치에서 워크플로를 고치면 지울 수 있으므로, 진짜 차단은 production environment의 브랜치 제한이 한다
    if: github.ref == 'refs/heads/main'
    # AWS 배포 역할은 이 environment에서 온 요청만 받는다 (infra/terraform/deploy.tf)
    # environment는 main 브랜치만 쓸 수 있게 제한돼 있다 (Settings → Environments → production)
    environment: production
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # CI와 같은 검사(포맷, 테스트)를 통과한 jar만 배포한다
      - name: 빌드, 포맷 검사, 테스트
        working-directory: backend
        run: |
          ./gradlew build
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar')" build/libs/app.jar

      - uses: docker/setup-buildx-action@v4

      # 서버가 ARM(t4g)이라 arm64 이미지를 만든다. Dockerfile에 RUN이 없어서 에뮬레이션이 필요 없다
      - name: 이미지 빌드 (arm64)
        run: |
          docker buildx build --platform linux/arm64 \
            -t "chakchak-backend:${GITHUB_SHA}" \
            --output "type=docker,dest=backend-image.tar" backend
          gzip -1 backend-image.tar

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 파일 올리기 (S3 releases/커밋)
        run: |
          DEST="s3://${{ vars.DEPLOY_BUCKET }}/releases/${GITHUB_SHA}"
          aws s3 cp --only-show-errors backend-image.tar.gz "$DEST/backend-image.tar.gz"
          for f in compose.prod.yml Caddyfile config.alloy deploy.sh; do
            aws s3 cp --only-show-errors "deploy/$f" "$DEST/$f"
          done

      - name: 서버에서 배포 실행 (SSM)
        run: |
          RELEASE="s3://${{ vars.DEPLOY_BUCKET }}/releases/${GITHUB_SHA}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "chakchak deploy ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"aws s3 cp --only-show-errors ${RELEASE}/deploy.sh /tmp/chakchak-deploy.sh\",\"bash /tmp/chakchak-deploy.sh ${GITHUB_SHA} ${{ vars.DEPLOY_BUCKET }}\"]" \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query StandardErrorContent --output text | tail -40
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]
