name: frontend-ci

# 프론트 코드나 이 파일이 바뀔 때만 돈다. 백엔드·문서·인프라만 바뀐 PR에서는 돌지 않는다.
# frontend/ 안의 Markdown(README 등)만 바뀌어도 돌지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이 job(frontend)을 필수 상태 체크로 지정하면 paths 필터로 건너뛴 PR은 Pending으로 남아 머지가 막힌다.
  # 필수로 바꿀 때는 paths 필터를 빼거나, 변경 감지 후 스텝만 건너뛰는 방식으로 바꾼다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # uses 스텝의 cache-dependency-path는 working-directory가 적용되지 않으므로 저장소 최상위 기준으로 적는다.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 설치한다. lock과 package.json이 어긋나면 여기서 실패한다.
      - name: 의존성 설치
        run: npm ci

      # next build도 타입을 보지만, 따로 돌려서 타입 에러인지 빌드 에러인지 바로 구분되게 한다.
      - name: 타입 검사
        run: npm run typecheck

      # BACKEND_URL은 rewrites 주소로만 쓰여 빌드 때 백엔드가 떠 있을 필요는 없다. 비우면 localhost:8080을 쓴다.
      - name: 빌드
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
