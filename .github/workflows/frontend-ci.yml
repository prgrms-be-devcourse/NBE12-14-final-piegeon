name: frontend-ci

# 프론트 코드나 이 파일이 바뀔 때만 돈다. 백엔드·문서·인프라만 바뀐 PR에서는 돌지 않는다.
# frontend/ 안의 Markdown(README 등)만 바뀌어도 돌지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이 job(frontend)을 필수 상태 체크로 지정하면 paths 필터로 건너뛴 PR은 Pending으로 남아 머지가 막힌다.
  # 필수로 바꿀 때는 paths 필터를 빼거나, 변경 감지 후 스텝만 건너뛰는 방식으로 바꾼다.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # uses 스텝의 cache-dependency-path는 working-directory가 적용되지 않으므로 저장소 최상위 기준으로 적는다.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 설치한다. lock과 package.json이 어긋나면 여기서 실패한다.
      - name: 의존성 설치
        run: npm ci

      # next build가 이전 빌드 결과를 다시 쓰도록 .next/cache를 실행 사이에 남긴다.
      # 의존성이나 소스가 바뀌면 키가 달라지고, 그때는 lock이 같은 가장 최근 캐시를 이어 쓴다.
      # uses 스텝의 path는 working-directory가 적용되지 않으므로 저장소 최상위 기준으로 적는다.
      - name: Next 빌드 캐시
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/next.config.ts', 'frontend/tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      # BACKEND_URL은 rewrites 주소로만 쓰여 빌드 때 백엔드가 떠 있을 필요는 없다. 비우면 localhost:8080을 쓴다.
      - name: 빌드
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # next-env.d.ts는 .gitignore에 있어 CI에는 없고, next build가 만든다. 그래서 빌드 뒤에 돌린다.
      # 빌드 전에 돌리면 CSS 모듈·이미지 import의 타입을 몰라 로컬에서만 통과하는 일이 생긴다.
      # next build도 타입을 보지만, 따로 돌려서 tsconfig의 include 전체를 같은 규칙으로 한 번 더 본다.
      - name: 타입 검사
        run: npm run typecheck
