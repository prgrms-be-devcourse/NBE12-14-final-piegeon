spring:
  application:
    name: chakchak
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# Google Places (장소 검색 P-01, 장소 확인 P-02). api-key는 프로필별 파일에서 환경변수로 받는다.
app:
  google-places:
    base-url: https://places.googleapis.com
    timeout: 3s
  # API 호출 횟수 제한. API별 한도는 controller 메서드의 @RateLimit에 있다.
  rate-limit:
    enabled: true
  # 13-2 안건 마감 스케줄러. 매분 0초에 돈다.
  scheduler:
    agenda-deadline-cron: "0 * * * * *"
    room-cleanup-cron: "0 0 3 * * *"
