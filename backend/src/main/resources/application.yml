spring:
  application:
    name: chakchak
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # 응답 시간 목표(SLO)를 재기 위한 기준선. API마다 이 시간 안에 끝난 요청 수를 따로 센다.
  # 일반 API는 0.5초, Google을 부르는 API(장소 검색, 장소 후보 등록, 장소 사진)는 1~3초 중에서
  # 실제 값을 보고 고른다. 어느 API에 어느 기준선을 쓸지는 Grafana 쿼리에서 정한다.
  metrics:
    distribution:
      slo:
        http.server.requests: 500ms,1s,2s,3s

# Google Places (장소 검색 P-01, 장소 확인 P-02). api-key는 프로필별 파일에서 환경변수로 받는다.
app:
  google-places:
    base-url: https://places.googleapis.com
    timeout: 3s
  # API 호출 횟수 제한. API별 한도는 controller 메서드의 @RateLimit에 있다.
  rate-limit:
    enabled: true
  # 13-2 안건 마감 스케줄러. 매분 0초에 돈다.
  scheduler:
    agenda-deadline-cron: "0 * * * * *"
    room-cleanup-cron: "0 0 3 * * *"
